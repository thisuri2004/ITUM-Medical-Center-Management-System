
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Appointments - ITUM Medical Center</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #0b2a5b;
        }

        header {
            background: #0b2a5b;
            color: white;
            padding: 22px 35px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h2 {
            font-size: 21px;
        }

        .back-btn {
            background: white;
            color: #0b2a5b;
            padding: 10px 16px;
            border-radius: 7px;
            text-decoration: none;
            font-weight: bold;
        }

        main {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .page-heading {
            margin-bottom: 25px;
        }

        .page-heading h1 {
            margin-bottom: 8px;
        }

        .page-heading p {
            color: #64748b;
        }

        .table-panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.06);
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 650px;
        }

        th, td {
            padding: 16px 12px;
            text-align: left;
            border-bottom: 1px solid #e5eaf1;
        }

        th {
            background: #f0f4fa;
            color: #0b2a5b;
            font-size: 13px;
        }

        td {
            font-size: 14px;
        }

        .status {
            display: inline-block;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .approved {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .completed {
            background: #dbeafe;
            color: #1e40af;
        }

        .cancelled {
            background: #e5e7eb;
            color: #374151;
        }

        .message {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }

        footer {
            text-align: center;
            padding: 25px;
            color: #64748b;
            font-size: 13px;
        }
    </style>
</head>

<body>

<header>
    <h2>ITUM Medical Center</h2>
    <a href="student-dashboard.html" class="back-btn">← Dashboard</a>
</header>

<main>

    <div class="page-heading">
        <h1>My Appointments</h1>
        <p>View your appointment details and current status.</p>
    </div>

    <div class="table-panel">
        <table>
            <thead>
                <tr>
                    <th>DOCTOR</th>
                    <th>DATE</th>
                    <th>TIME</th>
                    <th>REASON</th>
                    <th>STATUS</th>
                </tr>
            </thead>

            <tbody id="appointmentsBody">
                <tr>
                    <td colspan="5" class="message">
                        Loading appointments...
                    </td>
                </tr>
            </tbody>
        </table>
    </div>

</main>

<footer>
    © 2026 ITUM Medical Center Management System. All Rights Reserved.
</footer>

<script>
    
const user = JSON.parse(
    localStorage.getItem("loggedInUser") || "null"
);

if (!user || !["student", "staff"].includes(user.role)) {
    window.location.href = "index.html";
} else {
    loadAppointments();
}

async function loadAppointments() {
    const tbody = document.getElementById("appointmentsBody");

    try {
        const response = await fetch(
            `http://127.0.0.1:5000/student/appointments/${user.user_id}`
        );

        const data = await response.json();

        if (!response.ok) {
            throw new Error(data.error || "Unable to load appointments.");
        }

        // Get appointments array from backend response
        const appointments = data.appointments;

        if (!Array.isArray(appointments) || appointments.length === 0) {
            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="message">
                        No appointments found.
                    </td>
                </tr>
            `;
            return;
        }

        tbody.innerHTML = "";

        appointments.forEach(appointment => {
            const row = document.createElement("tr");

            const values = [
                appointment.doctor_name || "Not assigned",
                appointment.appointment_date || "-",
                appointment.appointment_time || "-",
                appointment.reason || "-"
            ];

            values.forEach(value => {
                const cell = document.createElement("td");
                cell.textContent = value;
                row.appendChild(cell);
            });

            const statusCell = document.createElement("td");
            const badge = document.createElement("span");

            const status = String(
                appointment.status || "pending"
            ).toLowerCase();

            badge.className = "status " + status;
            badge.textContent = status;

            statusCell.appendChild(badge);
            row.appendChild(statusCell);

            tbody.appendChild(row);
        });

    } catch (error) {
        tbody.innerHTML = `
            <tr>
                <td colspan="5" class="message">
                    ${error.message}
                </td>
            </tr>
        `;
    }
}

</script>

</body>
</html>
