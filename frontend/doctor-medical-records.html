
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medical Records - ITUM Medical Center</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            display: flex;
            min-height: 100vh;
            background: #f4f7fc;
            color: #1b2b45;
        }

        .sidebar {
            width: 250px;
            background: #0b2a5b;
            color: white;
            padding: 25px 18px;
        }

        .sidebar h2 {
            font-size: 21px;
            margin-bottom: 8px;
        }

        .sidebar p {
            color: #c9d8ee;
            font-size: 13px;
            margin-bottom: 35px;
        }

        .menu a {
            display: block;
            padding: 14px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 14px;
        }

        .menu a:hover,
        .menu a.active {
            background: #174783;
        }

        .logout {
            display: block;
            margin-top: 35px;
            color: white;
            text-decoration: none;
            padding: 12px;
        }

        .main {
            flex: 1;
            padding: 35px;
        }

        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .topbar h1 {
            color: #0b2a5b;
            font-size: 27px;
        }

        .doctor-info,
        .panel {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }

        .panel {
            max-width: 850px;
        }

        .panel h2 {
            color: #0b2a5b;
            margin-bottom: 10px;
        }

        .description {
            color: #718096;
            margin-bottom: 25px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #d9e2ee;
            border-radius: 7px;
            font-size: 14px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: #0b4f94;
        }

        button {
            background: #0b4f94;
            color: white;
            border: none;
            padding: 13px 25px;
            border-radius: 7px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #0b2a5b;
        }

        #message {
            margin-top: 18px;
            font-size: 14px;
        }

        @media(max-width: 700px) {
            .sidebar {
                width: 180px;
                padding: 15px 10px;
            }

            .main {
                padding: 18px;
            }

            .topbar {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
        }
    </style>
</head>

<body>

    <aside class="sidebar">
        <h2>ITUM Medical</h2>
        <p>Doctor Portal</p>

        <nav class="menu">
            <a href="doctor-dashboard.html">▦ &nbsp; Dashboard</a>
            <a href="doctor-dashboard.html#appointments">▣ &nbsp; Appointment Requests</a>
            <a href="#" class="active">✚ &nbsp; Medical Records</a>
        </nav>

        <a href="#" class="logout" onclick="logout()">↪ &nbsp; Logout</a>
    </aside>

    <main class="main">

        <header class="topbar">
            <h1>Medical Records</h1>

            <div class="doctor-info">
                👨‍⚕️ <span id="doctorName">Doctor</span>
            </div>
        </header>

        <section class="panel">

            <h2>Create Medical Record</h2>

            <p class="description">
                Select a patient and enter their diagnosis and treatment details.
            </p>

            <form id="recordForm">

                <div class="form-group">
                    <label for="patient">Select Patient</label>

                    <select id="patient" required>
                        <option value="">Loading patients...</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="registrationNumber">Registration Number</label>

                    <input type="text"
                           id="registrationNumber"
                           readonly
                           placeholder="Patient registration number">
                </div>

                <div class="form-group">
                    <label for="diagnosis">Diagnosis</label>

                    <textarea id="diagnosis"
                              required
                              placeholder="Enter diagnosis"></textarea>
                </div>

                <div class="form-group">
                    <label for="treatment">Treatment</label>

                    <textarea id="treatment"
                              required
                              placeholder="Enter treatment details"></textarea>
                </div>

                <button type="submit">Save Medical Record</button>

                <p id="message"></p>

            </form>

        </section>

    </main>

    <script>
        const loggedInUser = JSON.parse(
            localStorage.getItem("loggedInUser") || "null"
        );

        const patientSelect = document.getElementById("patient");
        const registrationInput = document.getElementById("registrationNumber");
        const message = document.getElementById("message");

        if (!loggedInUser || loggedInUser.role !== "doctor") {
            window.location.href = "index.html";
        } else {
            document.getElementById("doctorName").textContent =
                loggedInUser.full_name;

            loadPatients();
        }

        // Load patients
        async function loadPatients() {

            try {
                const response = await fetch(
                    "http://127.0.0.1:5000/patients"
                );

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || "Unable to load patients.");
                }

                patientSelect.innerHTML =
                    '<option value="">Select a patient</option>';

                data.patients.forEach(patient => {

                    const option = document.createElement("option");

                    option.value = patient.patient_id;
                    option.textContent =
                        patient.full_name + " (" +
                        patient.patient_type.toUpperCase() + ")";

                    option.dataset.registration =
                        patient.registration_number || "";

                    patientSelect.appendChild(option);
                });

                if (data.patients.length === 0) {
                    patientSelect.innerHTML =
                        '<option value="">No patients available</option>';
                }

            } catch (error) {
                patientSelect.innerHTML =
                    '<option value="">Unable to load patients</option>';

                message.textContent = error.message;
                message.style.color = "#dc3545";
            }
        }

        // Show registration number
        patientSelect.addEventListener("change", function() {

            const selectedOption =
                patientSelect.options[patientSelect.selectedIndex];

            registrationInput.value =
                selectedOption.dataset.registration || "";
        });

        // Save medical record
        document.getElementById("recordForm").addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const patientId = patientSelect.value;
                const diagnosis =
                    document.getElementById("diagnosis").value.trim();
                const treatment =
                    document.getElementById("treatment").value.trim();

                if (!patientId || !diagnosis || !treatment) {
                    message.textContent = "Please fill in all fields.";
                    message.style.color = "#dc3545";
                    return;
                }

                try {
                    const response = await fetch(
                        "http://127.0.0.1:5000/medical-records",
                        {
                            method: "POST",
                            headers: {
                                "Content-Type": "application/json"
                            },
                            body: JSON.stringify({
                                user_id: loggedInUser.user_id,
                                patient_id: Number(patientId),
                                diagnosis: diagnosis,
                                treatment: treatment
                            })
                        }
                    );

                    const data = await response.json();

                    if (!response.ok) {
                        throw new Error(
                            data.error || "Unable to save medical record."
                        );
                    }

                    message.textContent = data.message;
                    message.style.color = "#198754";

                    document.getElementById("recordForm").reset();
                    registrationInput.value = "";

                } catch (error) {
                    message.textContent = error.message;
                    message.style.color = "#dc3545";
                }
            }
        );

        function logout() {
            localStorage.removeItem("loggedInUser");
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
