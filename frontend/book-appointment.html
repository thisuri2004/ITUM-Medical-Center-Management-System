
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Appointment | ITUM Medical Center</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #24344d;
        }

        .header {
            background: #0b2a5b;
            color: white;
            padding: 22px 35px;
        }

        .header h2 {
            font-size: 22px;
        }

        .header p {
            margin-top: 6px;
            font-size: 13px;
            color: #d9e6f7;
        }

        .container {
            max-width: 850px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .back-link {
            display: inline-block;
            color: #1565d8;
            text-decoration: none;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .form-card {
            background: white;
            padding: 35px;
            border-radius: 14px;
            box-shadow: 0 5px 22px rgba(0,0,0,0.06);
        }

        .form-card h2 {
            color: #0b2a5b;
            margin-bottom: 8px;
        }

        .description {
            color: #718096;
            margin-bottom: 28px;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
            font-size: 14px;
        }

        input, select, textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #d9e2ee;
            border-radius: 7px;
            outline: none;
            font-size: 14px;
            background: white;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #1565d8;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            background: #0b4f94;
            color: white;
            border: none;
            padding: 14px 25px;
            border-radius: 7px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }

        button:hover {
            background: #0b2a5b;
        }

        .message {
            margin-top: 15px;
            font-size: 14px;
        }

        @media (max-width: 600px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .form-card {
                padding: 22px;
            }
        }
    </style>
</head>

<body>

    <header class="header">
        <h2>ITUM Medical Center</h2>
        <p>Medical Center Management System</p>
    </header>

    <main class="container">

        <a href="student-dashboard.html" class="back-link">
            ← Back to Dashboard
        </a>

        <section class="form-card">

            <h2>Book an Appointment</h2>

            <p class="description">
                Fill in the details below to request a medical appointment.
            </p>

            <form id="appointmentForm">

                <div class="form-group">
                    <label for="doctor">Select Doctor</label>

                    <select id="doctor" required>
                        <option value="">Loading doctors...</option>
                    </select>
                </div>

                <div class="form-row">

                    <div class="form-group">
                        <label for="date">Appointment Date</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="time">Appointment Time</label>
                        <input type="time" id="time" required>
                    </div>

                </div>

                <div class="form-group">
                    <label for="reason">Reason for Appointment</label>
                    <textarea id="reason"
                        placeholder="Briefly describe your medical concern..."
                        required></textarea>
                </div>

                <button type="submit">Submit Appointment Request</button>

                <p id="message" class="message"></p>

            </form>

        </section>
    </main>

    
<script>
    const doctorSelect = document.getElementById("doctor");
    const message = document.getElementById("message");
    const appointmentForm = document.getElementById("appointmentForm");

    // Load doctors from Flask backend
    async function loadDoctors() {
        try {
            const response = await fetch(
                "http://127.0.0.1:5000/doctors"
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Could not load doctors.");
            }

            doctorSelect.innerHTML =
                '<option value="">Select a Doctor</option>';

            data.doctors.forEach(doctor => {
                const option = document.createElement("option");

                option.value = doctor.doctor_id;
                option.textContent =
                    doctor.full_name + " - " + doctor.specialization;

                doctorSelect.appendChild(option);
            });

            if (data.doctors.length === 0) {
                doctorSelect.innerHTML =
                    '<option value="">No doctors available</option>';
            }

        } catch (error) {
            doctorSelect.innerHTML =
                '<option value="">Unable to load doctors</option>';

            console.error(error);
        }
    }

    loadDoctors();


    // Submit Appointment
    appointmentForm.addEventListener("submit", async function(event) {

        event.preventDefault();

        message.textContent = "";

        // Get logged-in user
        const loggedInUser = JSON.parse(
            localStorage.getItem("loggedInUser") || "null"
        );

        if (!loggedInUser) {
            message.style.color = "red";
            message.textContent = "Please login first.";
            return;
        }

        const appointmentData = {
            user_id: loggedInUser.user_id,
            doctor_id: doctorSelect.value,
            appointment_date: document.getElementById("date").value,
            appointment_time: document.getElementById("time").value,
            reason: document.getElementById("reason").value.trim()
        };

        try {
            const response = await fetch(
                "http://127.0.0.1:5000/appointments",
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(appointmentData)
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Appointment submission failed.");
            }

            message.style.color = "green";
            message.textContent =
                data.message + " Your appointment is pending approval.";

            appointmentForm.reset();

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;

            console.error("Appointment Error:", error);
        }
    });
</script>


</body>
</html>
