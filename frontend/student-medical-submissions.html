<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Medical Submissions - ITUM</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fc;
            color: #263957;
            padding: 35px;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            color: #0b2a5b;
            margin-bottom: 10px;
        }

        .header p {
            color: #718096;
        }

        .back-btn {
            display: inline-block;
            margin-bottom: 20px;
            padding: 10px 18px;
            background: #0b4f94;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .submission-card {
            background: white;
            padding: 25px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.06);
            border-left: 5px solid #0b4f94;
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .card-top h3 {
            color: #0b2a5b;
        }

        .status {
            padding: 7px 14px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: capitalize;
        }

        .pending {
            background: #fff3cd;
            color: #856404;
        }

        .accepted {
            background: #d4edda;
            color: #155724;
        }

        .rejected {
            background: #f8d7da;
            color: #721c24;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 18px;
        }

        .detail p {
            margin-top: 6px;
            color: #52647d;
        }

        .remarks {
            margin-top: 20px;
            padding: 15px;
            background: #f4f7fc;
            border-radius: 8px;
        }

        .remarks p {
            margin-top: 8px;
        }

        .view-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 17px;
            background: #0b4f94;
            color: white;
            text-decoration: none;
            border-radius: 7px;
        }

        .empty {
            background: white;
            padding: 35px;
            text-align: center;
            border-radius: 12px;
            color: #718096;
        }

        .error {
            color: #c62828;
            margin-bottom: 20px;
        }

        @media(max-width: 600px) {
            body {
                padding: 18px;
            }

            .details {
                grid-template-columns: 1fr;
            }

            .card-top {
                align-items: flex-start;
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="student-dashboard.html" class="back-btn">
        ← Back to Dashboard
    </a>

    <div class="header">
        <h1>My Medical Submissions</h1>
        <p>View your submitted medical certificates and their current status.</p>
    </div>

    <div id="message"></div>
    <div id="submissions"></div>

</div>

<script>
    const user = JSON.parse(
        localStorage.getItem("loggedInUser") || "null"
    );

    const submissionsContainer =
        document.getElementById("submissions");

    const message = document.getElementById("message");

    if (!user || !["student", "staff"].includes(user.role)) {
        window.location.href = "index.html";
    } else {
        loadSubmissions();
    }

    async function loadSubmissions() {
        try {
            const response = await fetch(
                `http://127.0.0.1:5000/student/medical-submissions/${user.user_id}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.message || "Unable to load submissions");
            }

            if (!data.submissions || data.submissions.length === 0) {
                submissionsContainer.innerHTML = `
                    <div class="empty">
                        <h3>No Medical Submissions Found</h3>
                        <p>You have not submitted any medical certificates yet.</p>
                    </div>
                `;
                return;
            }

            submissionsContainer.innerHTML = data.submissions.map(item => {

                const statusClass = item.status.toLowerCase();

                const documentUrl =
                    `http://127.0.0.1:5000/student/medical-submissions/${item.submission_id}/document?user_id=${user.user_id}`;

                return `
                    <div class="submission-card">

                        <div class="card-top">
                            <h3>Medical Submission #${item.submission_id}</h3>

                            <span class="status ${statusClass}">
                                ${item.status}
                            </span>
                        </div>

                        <div class="details">

                            <div class="detail">
                                <strong>Leave From</strong>
                                <p>${item.leave_from}</p>
                            </div>

                            <div class="detail">
                                <strong>Leave To</strong>
                                <p>${item.leave_to}</p>
                            </div>

                            <div class="detail">
                                <strong>Submitted Date</strong>
                                <p>${item.submitted_at || "N/A"}</p>
                            </div>

                            <div class="detail">
                                <strong>Reviewed Date</strong>
                                <p>${item.reviewed_at || "Not reviewed yet"}</p>
                            </div>

                        </div>

                        <div class="remarks">
                            <strong>Reason</strong>
                            <p>${item.reason || "N/A"}</p>
                        </div>

                        <div class="remarks">
                            <strong>Doctor Remarks</strong>
                            <p>${item.doctor_remarks || "No remarks available yet."}</p>
                        </div>

                        <a href="${documentUrl}"
                           target="_blank"
                           class="view-btn">
                            View Medical Certificate
                        </a>

                    </div>
                `;
            }).join("");

        } catch (error) {
            message.innerHTML = `
                <p class="error">${error.message}</p>
            `;
        }
    }
</script>

</body>
</html>
