
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Doctor Medical Submissions</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f3f6fb;
            color: #0b2a5b;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        .back-link {
            display: inline-block;
            margin-bottom: 25px;
            color: #1565d8;
            text-decoration: none;
        }

        h2 {
            margin-bottom: 10px;
        }

        .description {
            color: #66758c;
            margin-bottom: 25px;
        }

        .submission-card {
            background: white;
            padding: 24px;
            margin-bottom: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-bottom: 18px;
            flex-wrap: wrap;
        }

        .student-name {
            font-size: 18px;
            font-weight: bold;
        }

        .status {
            padding: 7px 13px;
            border-radius: 20px;
            background: #fff3cd;
            color: #856404;
            font-size: 13px;
            font-weight: bold;
        }

        .details {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .detail {
            color: #52647c;
            line-height: 1.6;
        }

        .detail strong {
            color: #0b2a5b;
        }

        .document-link {
            display: inline-block;
            color: #1565d8;
            text-decoration: none;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            padding: 11px 22px;
            border: none;
            border-radius: 7px;
            color: white;
            cursor: pointer;
            font-weight: bold;
        }

        .accept {
            background: #198754;
        }

        .reject {
            background: #dc3545;
        }

        button:hover {
            opacity: 0.85;
        }

        .remarks {
            width: 100%;
            padding: 11px;
            margin-bottom: 15px;
            border: 1px solid #d9e2ee;
            border-radius: 7px;
            resize: vertical;
            min-height: 65px;
        }

        #message {
            margin: 20px 0;
            font-weight: bold;
        }

        .empty {
            background: white;
            padding: 30px;
            text-align: center;
            border-radius: 10px;
            color: #66758c;
        }

        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .details {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <a href="doctor-dashboard.html" class="back-link">
        ← Back to Dashboard
    </a>

    <h2>Medical Certificate Submissions</h2>

    <p class="description">
        Review medical certificates submitted by students and staff.
    </p>

    <p id="message">Loading submissions...</p>

    <div id="submissionsContainer"></div>

</div>

<script>
    const user = JSON.parse(
        localStorage.getItem("loggedInUser") || "null"
    );

    const container = document.getElementById("submissionsContainer");
    const message = document.getElementById("message");

    if (!user || user.role !== "doctor") {
        window.location.href = "index.html";
    }

    function escapeHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    async function loadSubmissions() {
        try {
            const response = await fetch(
                `http://127.0.0.1:5000/doctor/medical-submissions/${user.user_id}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Unable to load submissions.");
            }

            const submissions = data.submissions || [];

            container.innerHTML = "";

            if (submissions.length === 0) {
                message.textContent = "";
                container.innerHTML = `
                    <div class="empty">
                        No medical certificate submissions found.
                    </div>
                `;
                return;
            }

            message.textContent = "";

            submissions.forEach(item => {
                const status = String(item.status || "").toLowerCase();

                const documentURL =
                    `http://127.0.0.1:5000/doctor/medical-submissions/${item.submission_id}/document?user_id=${encodeURIComponent(user.user_id)}`;

                const card = document.createElement("div");
                card.className = "submission-card";

                card.innerHTML = `
                    <div class="card-header">
                        <div class="student-name">
                            ${escapeHTML(item.student_name)}
                        </div>

                        <span class="status">
                            ${escapeHTML(item.status)}
                        </span>
                    </div>

                    <div class="details">
                        <div class="detail">
                            <strong>Registration Number:</strong><br>
                            ${escapeHTML(item.registration_number)}
                        </div>

                        <div class="detail">
                            <strong>Patient Type:</strong><br>
                            ${escapeHTML(item.patient_type)}
                        </div>

                        <div class="detail">
                            <strong>Leave From:</strong><br>
                            ${escapeHTML(item.leave_from)}
                        </div>

                        <div class="detail">
                            <strong>Leave To:</strong><br>
                            ${escapeHTML(item.leave_to)}
                        </div>

                        <div class="detail">
                            <strong>Reason:</strong><br>
                            ${escapeHTML(item.reason)}
                        </div>

                        <div class="detail">
                            <strong>Submitted At:</strong><br>
                            ${escapeHTML(item.submitted_at)}
                        </div>
                    </div>

                    <a class="document-link"
                       href="${documentURL}"
                       target="_blank"
                       rel="noopener noreferrer">
                       📄 View Medical Certificate
                    </a>

                    ${
                        status === "pending"
                        ? `
                            <textarea
                                class="remarks"
                                placeholder="Enter doctor remarks..."
                            ></textarea>

                            <div class="actions">
                                <button class="accept">Accept</button>
                                <button class="reject">Reject</button>
                            </div>
                        `
                        : `
                            <p>
                                <strong>Doctor Remarks:</strong>
                                ${escapeHTML(item.doctor_remarks || "No remarks")}
                            </p>
                        `
                    }
                `;

                if (status === "pending") {
                    const remarks = card.querySelector(".remarks");

                    card.querySelector(".accept").addEventListener(
                        "click",
                        () => reviewSubmission(item.submission_id, "accepted", remarks.value)
                    );

                    card.querySelector(".reject").addEventListener(
                        "click",
                        () => reviewSubmission(item.submission_id, "rejected", remarks.value)
                    );
                }

                container.appendChild(card);
            });

        } catch (error) {
            message.style.color = "red";
            message.textContent = error.message;
        }
    }

    async function reviewSubmission(submissionId, status, remarks) {
        const confirmation = confirm(
            `Are you sure you want to ${status} this submission?`
        );

        if (!confirmation) return;

        try {
            const response = await fetch(
                `http://127.0.0.1:5000/medical-submissions/${submissionId}/status`,
                {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        user_id: user.user_id,
                        status: status,
                        doctor_remarks: remarks
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Review failed.");
            }

            alert(data.message || "Submission reviewed successfully.");

            loadSubmissions();

        } catch (error) {
            alert(error.message);
        }
    }

    if (user && user.role === "doctor") {
        loadSubmissions();
    }
</script>

</body>
</html>
